<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Prediction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            padding: 40px 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            max-width: 700px;
            width: 100%;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #4a5568;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        h2::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background: #667eea;
            margin: 8px auto 0 auto;
            border-radius: 2px;
        }

        form {
            display: grid;
            gap: 20px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Responsive stack on mobile screens */
        @media (max-width: 600px) {
            .row {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: flex;
            flex-direction: column;
            font-weight: 600;
            font-size: 14px;
            color: #4a5568;
        }

        input, select {
            margin-top: 8px;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background-color: #f8fafc;
            color: #334155;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #667eea;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        button {
            margin-top: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            color: #166534;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            animation: fadeIn 0.4s ease-out;
        }

        .result-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #15803d;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #718096;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #667eea;
            text-decoration: underline;
        }

        /* Footer Styles */
        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
        }

        footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Student Performance Prediction</h2>

        <form action="{{ url_for('predict_datapoint') }}" method="POST">
            <div class="row">
                <label>
                    Gender
                    <select name="gender" required>
                        <option value="" disabled selected>Select gender</option>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                    </select>
                </label>

                <label>
                    Race / Ethnicity
                    <select name="race_ethnicity" required>
                        <option value="" disabled selected>Select group</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </label>
            </div>

            <div class="row">
                <label>
                    Parent Education
                    <select name="parental_level_of_education" required>
                        <option value="" disabled selected>Select level</option>
                        <option value="associate's degree">Associate's Degree</option>
                        <option value="bachelor's degree">Bachelor's Degree</option>
                        <option value="high school">High School</option>
                        <option value="master's degree">Master's Degree</option>
                        <option value="some college">Some College</option>
                        <option value="some high school">Some High School</option>
                    </select>
                </label>

                <label>
                    Lunch Type
                    <select name="lunch" required>
                        <option value="" disabled selected>Select lunch</option>
                        <option value="free/reduced">Free/Reduced</option>
                        <option value="standard">Standard</option>
                    </select>
                </label>
            </div>

            <div class="row">
                <label>
                    Test Preparation Course
                    <select name="test_preparation_course" required>
                        <option value="" disabled selected>Select status</option>
                        <option value="completed">Completed</option>
                        <option value="none">None</option>
                    </select>
                </label>

                <label>
                    Reading Score (0-100)
                    <input type="number" name="reading_score" min="0" max="100" placeholder="e.g. 75" required>
                </label>
            </div>

            <div class="row">
                <label>
                    Writing Score (0-100)
                    <input type="number" name="writing_score" min="0" max="100" placeholder="e.g. 80" required>
                </label>
            </div>

            <button type="submit">Predict Performance</button>
        </form>

        {% if results is not none %}
        <div class="result-box">
            <div class="result-title">Predicted Score / Outcome</div>
            <div class="result-value">{{ results }}</div>
        </div>
        {% endif %}

        <a href="/" class="back-link">&larr; Back to Home</a>

        <!-- Added Footer here -->
        <footer>
            <p>&copy; 2026 Student Analytics Portal. Powered by <a href="#" target="_blank">Machine Learning</a></p>
        </footer>
    </div>

</body>
</html>
